    <title>Reset password | SHOPE</title>
<!--=include body-start.html  -->
<!--=include header.html  -->
<main class="main">
  <section class="resetpassword">
    <div class="container">
      <div class="resetpassword__inner">
        <h1 class="resetpassword__title">Have you Forgotten Your Password?</h1>
        <div class="resetpassword__subtitle">If you've forgotten your password, enter your e-mail address and we'll send
          you an e-mail</div>
        <form class="resetpassword__form" action="#" method="post">
          <div class="resetpassword__row d-flex flex-column">
            <input class="resetpassword__input" type="email" name="email" placeholder="Email" aria-label="Email" required
              autocomplete="email">
          </div>
          <button class="resetpassword__btn" type="submit">reset password</button>
        </form>
      </div>
    </div>
  </section>

</main>
